<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borologi</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        /* Kotak informasi loading di pojok layar */
        #loading-screen {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="loading-screen">Memuat model 3D... (0%)</div>

    <!-- Import Three.js dan GLTFLoader lewat CDN resmi ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. SIAPIN PANCI & KOMPR (Scene, Camera, Renderer)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222); // Warna latar belakang abu-abu gelap

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7); // Atur posisi mata/kamera mundur sedikit

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. NYALAKAN LAMPU DAPUR (Pencahayaan)
        // Lampu merata di seluruh ruangan agar tidak ada sisi yang gelap gulita
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        // Lampu sorot utama dari atas depan (biar relief/tekstur keliatan tajam)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // 3. REBUS MI-NYA: NARIK FILE 3D DARI URL ONLINE
        const loader = new GLTFLoader();
        
        // ⚠️ Ganti link di bawah ini dengan Direct Link file .glb kamu yang ada di cloud storage (Supabase/GitHub/dll)
        // Contoh di bawah menggunakan file sample publik standar dari Three.js
        const onlineModelUrl = 'https://www.dropbox.com/scl/fi/w5o1jl0h55r6wd208dvaw/BOROBUDUR.glb?rlkey=xehuoc0o8hsr16p2u5flll4b7&st=tfyn49x2&dl=0';

        loader.load(
            onlineModelUrl,
            
            // Berhasil dimuat!
            function (gltf) {
                const modelCandi = gltf.scene;
                
                // Atur skala jika ukurannya kekecilan/kebesaran di layar
                modelCandi.scale.set(2, 2, 2);
                
                scene.add(modelCandi);
                infoText.innerHTML = "Hore! Model 3D Berhasil Dimuat!";
                
                // Sembunyikan kotak loading setelah 2 detik
                setTimeout(() => {
                    infoText.style.display = 'none';
                }, 2000);
            },
            
            // Proses Loading (Indikator Persentase)
            function (xhr) {
                if (xhr.lengthComputable) {
                    const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                    infoText.innerHTML = `Sedang mendownload: ${percentComplete}%`;
                }
            },
            
            // Kalau Gagal
            function (error) {
                console.error('Gagal memuat model:', error);
                infoText.innerHTML = "Duh, gagal mengambil file 3D online-nya!";
                infoText.style.background = "rgba(200, 0, 0, 0.8)";
            }
        );

        // 4. NYALAKAN KOMPORKU TERUS (Animation Loop & Auto-Rotate Biar Keren)
        let modelRef = null;
        // Kalau mau muterin modelnya secara otomatis pas tampil:
        // (Bisa kamu hapus bagian rotasinya kalau tidak butuh)
        
        function animate() {
            requestAnimationFrame(animate);

            // Jika scene punya objek tambahan selain lampu, kita bisa putar sedikit buat pamer
            scene.traverse((child) => {
                if (child.isGroup && child !== scene) {
                    child.rotation.y += 0.005; // Berputar perlahan ke samping
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Responsif kalau ukuran layar HP/Laptop diubah (Rotasi/Resize)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
